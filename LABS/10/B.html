<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Boxes</title>

    <style>

        body{
            background:#0a0660;
        }

        .main{
            width:750px;
            margin:auto;
            margin-top:40px;
        }

        .box{
            width:190px;
            height:110px;
            border-radius:5px;
            margin:15px;
            display:inline-block;
        }

        .b1{
            background:linear-gradient(135deg,#39ff74,#7df9ff,#d291ff);
        }

        .b2{
            background:linear-gradient(to right,#5fb0ff,#77d9d6);
        }

        .b3{
            background:linear-gradient(135deg,#ffd54f,#d633ff);
        }

        .b4{
            background:linear-gradient(to right,#ff9ec4,#ff8c42);
        }

        .b5{
            background:linear-gradient(to right,#b388ff,#f8bbd0);
        }

        .b6{
            background:linear-gradient(to right,#ff3d00,#ff00ff);
        }

        .b7{
            background:linear-gradient(to right,#ff4fc3,#3f51b5);
        }

        .b8{
            background:linear-gradient(to right,#ffd600,#fff9c4);
        }

        .b9{
            background:linear-gradient(to right,#ff5fa2,#ffa07a);
        }

        .b10{
            background:linear-gradient(to right,#d4ff7f,#a8ffeb);
        }

        .b11{
            background:linear-gradient(to right,#fff3c4,#d4d9ff);
        }

        .b12{
            background:linear-gradient(red,pink,orange);
        }

        .b13{
            background:linear-gradient(to right,#fffde7,#90a4ae);
        }

        .b14{
            background:linear-gradient(to right,#ffb74d,#7b1fa2);
        }

        .b15{
            background:linear-gradient(to right,#39ff74,#5c6bc0);
        }

    </style>

</head>
<body>

    <div class="main">
        <center>
        <div class="box b1"></div>
        <div class="box b2"></div>
        <div class="box b3"></div>

        <br>

        <div class="box b4"></div>
        <div class="box b5"></div>
        <div class="box b6"></div>

        <br>

        <div class="box b7"></div>
        <div class="box b8"></div>
        <div class="box b9"></div>

        <br>

        <div class="box b10"></div>
        <div class="box b11"></div>
        <div class="box b12"></div>

        <br>

        <div class="box b13"></div>
        <div class="box b14"></div>
        <div class="box b15"></div>
        </center>
    </div>

</body>
</html>
