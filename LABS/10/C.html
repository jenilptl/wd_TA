<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Cards</title>

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:Arial;
}

.main{
    width:900px;
    margin:auto;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-around;
}

.card{
    width:150px;
    background:white;
    margin:15px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

.top{
    height:120px;
    border-radius:10px 10px 0 0;
}

.bottom{
    padding:10px;
}

.c1{background:linear-gradient(#FCE38A,#F38181);}
.c2{background:linear-gradient(#F54EA2,#FF7676);}
.c3{background:linear-gradient(#17EAD9,#6078EA);}
.c4{background:linear-gradient(#622774,#C53364);}
.c5{background:linear-gradient(#7117EA,#EA6060);}
.c6{background:linear-gradient(#42E695,#3BB2B8);}
.c7{background:linear-gradient(#F02FC2,#6094EA);}
.c8{background:linear-gradient(#65799B,#5E2563);}
.c9{background:linear-gradient(#184E68,#57CA85);}
.c10{background:linear-gradient(#5B247A,#1BCEDF);}
.c11{background:linear-gradient(#74276C,#FD8263);}
.c12{background:linear-gradient(#274B74,#E963FD);}
.c13{background:linear-gradient(#879AF2,#FDA000);}
.c14{background:linear-gradient(#8929AD,#43B7B8);}
.c15{background:linear-gradient(#276174,#63FD88);}
.c16{background:linear-gradient(#574BCD,#41E975);}
.c17{background:linear-gradient(#363553,#E8458B);}
.c18{background:linear-gradient(#5C2774,#637FFD);}
.c19{background:linear-gradient(#EA5A6F,#FCCF3A);}
.c20{background:linear-gradient(#F17B41,#CD4BC9);}

</style>

</head>
<body>

<div class="main">
