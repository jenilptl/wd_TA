<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pseudo-class Demo</title>

    <style>
        /* ---------- 1. Hover on links inside a specific container ---------- */
        .link-box {
            padding: 10px;
            background-color: #f2f2f2;
            width: fit-content;
        }

        .link-box a {
            color: blue;
            text-decoration: none;
            margin-right: 10px;
            font-weight: bold;
        }

        .link-box a:hover {
            color: red;
            text-decoration: underline;
        }

        /* ---------- 2. Focus on input fields ---------- */
        input {
            padding: 8px;
            width: 250px;
            border: 1px solid gray;
            margin-bottom: 10px;
        }

        input:focus {
            border: 2px solid blue;
            background-color: #e6f2ff;
            outline: none;
        }

        /* ---------- 3. Hover on table rows ---------- */
        table {
            
            width: 300px;
            
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        tr:hover {
            background-color: #d1f0ff;
        }
    </style>
</head>

<body>

    <h2>1. Hover Effect on Links (Inside Container)</h2>
    <div class="link-box">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <p>
        <a href="#">This link is outside the container</a>
    </p>

    <hr>

    <h2>2. Focus Effect on Input Fields</h2>
    <form>
        <label>Name:</label><br>
        <input type="text"><br>

        <label>Email:</label><br>
        <input type="email">
    </form>

    <hr>

    <h2>3. Hover Effect on Table Rows</h2>
    <table cellspacing="0">
        <tr>
            <th>Name</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Anita</td>
            <td>90</td>
        </tr>
        <tr>
            <td>Ravi</td>
            <td>78</td>
        </tr>
    </table>

</body>
</html>
