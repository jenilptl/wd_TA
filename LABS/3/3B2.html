<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>
</head>
<body>

    <table border="1" cellpadding="10" cellspacing="0">

        <tr>
            <td rowspan="2" height="50px" valign="top">Batatas</td>
            <td rowspan="3" valign="top">Couves</td>
            <td valign="top">Alhos</td>
            <td valign="top" >Cebolas</td>
        </tr>

        <tr>
            <td colspan="2" rowspan="2"  valign="top">Alface</td>
        </tr>

        <tr>
            <td valign="top" align="left">Nabos</td>
        </tr>

    </table>

</body>
</html>
