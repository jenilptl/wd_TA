<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Forms</title>
</head>
<body>


<form>

<table cellpadding="8" align="center">

    <tr align="center">
        <th colspan="2"><h1>Student Registration</h1></th>
        <th></th>
        <th colspan="2"><h1>COVID-19 Vaccine Registration Form</h1></th>
    </tr>

    <tr align="center">
        <td>FullName</td>
        <td><input type="text"></td>
        <td></td>
        <td>First Name</td>
        <td><input type="text"></td>
    </tr>

    <tr align="center">
        <td>Email</td>
        <td><input type="email"></td>
        <td></td>
        <td>Last Name</td>
        <td><input type="text"></td>
    </tr>

    <tr align="center">
        <td>Mobile No</td>
        <td><input type="text" max="9999999999"></td>
        <td></td>
        <td>Aadhar Number</td>
        <td><input type="text"></td>
    </tr>

    <tr align="center">
        <td>Address</td>
        <td><textarea rows="6" cols="20"></textarea></td>
        <td></td>
        <td>Vaccine Name</td>
        <td>
            <select>
                <option>Please Select Vaccine Name</option>
                <option>Covishield</option>
                <option>Covaxin</option>
                <option>Sputnik V</option>
            </select>
        </td>
    </tr>

    <tr align="center">
        <td>Nationality</td>
        <td><input type="text"></td>
        <td></td>
        <td>Vaccination Center Name</td>
        <td>
            <select>
                <option>Please Select Vaccination Center Name</option>
                <option>Rajkot</option>
                <option>Ahmedabad</option>
                <option>Surat</option>
            </select>
        </td>
    </tr>

    <tr align="center">
        <td>Date Of Birth</td>
        <td><input type="date"></td>
        <td></td>
        <td>Date of Dose</td>
        <td><input type="date"></td>
    </tr>

    <tr align="center">
        <td>Gender</td>
        <td>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
        </td>
        <td></td>
        <td>Dose Number</td>
        <td><input type="number" style="width:35px;"></td>
    </tr>

    <tr align="center">
        <td>Highest Degree</td>
        <td>
            <select>
                <option>Select Degree</option>
                <option>BCA</option>
                <option>B.Sc</option>
                <option>B.Tech</option>
                <option>MCA</option>
            </select>
        </td>
        <td></td>
        <td></td>
        <td>
            <input type="submit" value="CLICK HERE">
            <input type="reset" value="CANCEL">
        </td>
    </tr>

    <tr align="center">
        <td>CPI</td>
        <td><input type="text"></td>
        <td></td>
        <td></td>
        <td></td>
    </tr>

    <tr align="center">
        <td>University</td>
        <td><input type="text"></td>
        <td></td>
        <td></td>
        <td></td>
    </tr>

    <tr align="center">
        <td>Passing Year</td>
        <td>
            <select>
                <option>Select Your Passing Year</option>
                <option>2023</option>
                <option>2024</option>
                <option>2025</option>
                <option>2026</option>
            </select>
        </td>

        <td></td>
        <td></td>
    </tr>

    <tr align="center">
        <td></td>
        <td>
            <input type="submit" value="Submit">
            <input type="reset" value="Cancel">
        </td>

        <td></td>
        <td></td>
    </tr>

</table>

</form>


</body>
</html>
