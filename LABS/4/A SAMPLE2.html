<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Forms</title>
</head>
<body>



<table cellpadding="20" align="center" cellspacing="10">
    <tr>

        <!-- Student Registration -->
        <td valign="top">

            <h1>Student Registration</h1>

            <form>
                <table cellpadding="8">

                    <tr>
                        <td>FullName</td>
                        <td><input type="text"></td>
                    </tr>

                    <tr>
                        <td>Email</td>
                        <td><input type="email"></td>
                    </tr>

                    <tr>
                        <td>Mobile No</td>
                        <td><input type="text"></td>
                    </tr>

                    <tr>
                        <td>Address</td>
                        <td><textarea rows="6" cols="20"></textarea></td>
                    </tr>

                    <tr>
                        <td>Nationality</td>
                        <td><input type="text"></td>
                    </tr>

                    <tr>
                        <td>Date Of Birth</td>
                        <td><input type="date"></td>
                    </tr>

                    <tr>
                        <td>Gender</td>
                        <td>
                            <input type="radio" name="gender">Male
                            <input type="radio" name="gender">Female
                        </td>
                    </tr>

                    <tr>
                        <td>Highest Degree</td>
                        <td>
                            <select>
                                <option>Select Degree</option>
                                <option>BCA</option>
                                <option>B.Sc</option>
                                <option>B.Tech</option>
                                <option>MCA</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>CPI</td>
                        <td><input type="text"></td>
                    </tr>

                    <tr>
                        <td>University</td>
                        <td><input type="text"></td>
                    </tr>

                    <tr>
                        <td>Passing Year</td>
                        <td>
                            <select>
                                <option>Select Your Passing Year</option>
                                <option>2023</option>
                                <option>2024</option>
                                <option>2025</option>
                                <option>2026</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" value="Submit">
                            <input type="reset" value="Cancel">
                        </td>
                    </tr>

                </table>
            </form>

        </td>


        <!-- COVID-19 Vaccine Registration -->
        <td valign="top">

            <h1>COVID-19 Vaccine Registration Form</h1>

            <form>
                <table cellpadding="10">

                    <tr>
                        <td>First Name</td>
                        <td><input type="text"></td>
                    </tr>

                    <tr>
                        <td>Last Name</td>
                        <td><input type="text"></td>
                    </tr>

                    <tr>
                        <td>Aadhar Number</td>
                        <td><input type="text"></td>
                    </tr>

                    <tr>
                        <td>Vaccine Name</td>
                        <td>
                            <select>
                                <option>Please Select Vaccine Name</option>
                                <option>Covishield</option>
                                <option>Covaxin</option>
                                <option>Sputnik V</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>Vaccination Center Name</td>
                        <td>
                            <select>
                                <option>Please Select Vaccination Center Name</option>
                                <option>Rajkot</option>
                                <option>Ahmedabad</option>
                                <option>Surat</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>Date of Dose</td>
                        <td><input type="date"></td>
                    </tr>

                    <tr>
                        <td>Dose Number</td>
                        <td><input type="number" style="width: 35px;"></td>
                    </tr>

                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" value="CLICK HERE">
                            <input type="reset" value="CANCEL">
                        </td>
                    </tr>

                </table>
            </form>

        </td>

    </tr>
</table>


</body>
</html>
