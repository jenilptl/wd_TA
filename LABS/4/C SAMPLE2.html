<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
</head>
<body>
<center>
<h1>Employee Registration</h1>

<form>

    <table cellpadding="8">

        <tr>
            <th colspan="7">Personal Information</th>
        </tr>

        <tr>
            <td>Employee Id</td>
            <td>:</td>
            <td><input type="text" placeholder="Enter Employee Id"></td>

            <td></td>

            <td>Employee Name</td>
            <td>:</td>
            <td><input type="text" placeholder="Enter Employee Name"></td>
        </tr>

        <tr>
            <td>Email</td>
            <td>:</td>
            <td><input type="email" placeholder="Enter Email"></td>

            <td></td>

            <td>Contact No</td>
            <td>:</td>
            <td><input type="text" placeholder="Enter Contact No"></td>
        </tr>

        <tr>
            <td>Marital Status</td>
            <td>:</td>
            <td>
                <input type="radio" name="status">Single
                <input type="radio" name="status">Married
            </td>

            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <th colspan="7">Education Qualification</th>
        </tr>

        <tr>
            <td>Education</td>
            <td>:</td>
            <td><input type="text" placeholder="Enter Education details"></td>

            <td></td>

            <td>Experience</td>
            <td>:</td>
            <td><input type="text" placeholder="Enter Experience Details"></td>
        </tr>

        <tr>
            <th colspan="7">Job Details</th>
        </tr>

        <tr>
            <td>Designation</td>
            <td>:</td>
            <td><input type="text" placeholder="Enter Designation details"></td>

            <td></td>

            <td>Job Location</td>
            <td>:</td>
            <td><input type="text" placeholder="Enter Job Location"></td>
        </tr>

        <tr>
            <td>Salary</td>
            <td>:</td>
            <td><input type="text" placeholder="Enter Salary details"></td>

            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <td colspan="7">
                <hr>
            </td>
        </tr>

        <tr>
            <td colspan="7" align="center">
                <input type="submit" value="Register">
            </td>
        </tr>

    </table>

</form>
</center>
</body>
</html>
