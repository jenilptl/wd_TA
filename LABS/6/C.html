<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Website Layout</title>
</head>
<body>

<table border="1" align="center" cellpadding="5" cellspacing="5" width="700">

    <tr>
        <td colspan="4" style="background-color:black; height:20px;"></td>
    </tr>

    <tr>

        <td rowspan="4" align="center" valign="middle" width="120">
            <font color="olive" size="5">
                <b>Html<br>Website<br>Layout</b>
            </font>
        </td>

        <td colspan="3" align="center" style="background-color:brown; color:white; height:60px;">
            <b>Header</b>
        </td>

    </tr>

    <tr>

        <td align="center" style="background-color:darkblue; color:white; width:100px; height:180px;">
            <b>Navigation</b>
        </td>

        <td align="center" style="background-color:yellow; width:250px; height:180px;">
            <b>Content</b>
        </td>

        <td align="center" valign="top" style="background-color:green; color:white; width:100px;">
            <br><br>
            <b>Sidebar</b>
        </td>

    </tr>

    <tr>

        <td></td>

        <td colspan="2" style="background-color:yellow; height:60px;"></td>

    </tr>

    <tr>

        <td colspan="3" align="center" style="background-color:skyblue; color:white; height:60px;">
            <b>Footer</b>
        </td>

    </tr>

    <tr>
        <td colspan="4" style="background-color:black; height:20px;"></td>
    </tr>

</table>

</body>
</html>
