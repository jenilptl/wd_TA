<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Animation</title>

    <style>

        div{
            width:100px;
            height:100px;
            background:red;
            position:relative;
            animation:custom 4s infinite;
        }

        @keyframes custom{

            from{
                background:red;
                left:0px;
            }

            to{
                background:yellow;
                left:300px;
            }

        }

    </style>

</head>
<body>

    <div></div>

</body>
</html>
