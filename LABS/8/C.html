<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Saver Animation</title>

    <style>

        div{
            width:100px;
            height:100px;
            background:red;
            position:relative;
            animation:screensaver 8s infinite;
        }

        @keyframes screensaver{

            0%{
                left:0px;
                top:0px;
            }

            25%{
                left:500px;
                top:0px;
            }

            50%{
                left:500px;
                top:300px;
            }

            75%{
                left:0px;
                top:300px;
            }

            100%{
                left:0px;
                top:0px;
            }

        }

    </style>

</head>
<body>

    <div></div>

</body>
</html>
